      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.wheat_eccentric_swan.sh
        container: qc.ver_rust_scrappy_skunk
timeout: 5400
