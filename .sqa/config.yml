config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.cream_enigmatic_ocelot.sh
        container: qc.acc_blush_peppy_gazelle
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_peaceful_octopus.sh
        container: qc.doc_wheat_rugged_mandrill
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.lapis_mysterious_chameleon.sh
        container: qc.doc_porcelain_dramatic_uakari
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.banana_gracious_flounder.sh
        container: qc.doc_dahlia_peppy_octopus
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sand_practical_flamingo.sh
        container: qc.lic_mango_relaxed_swan
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.gray_mysterious_dingo.sh
        container: qc.sec_gold_protective_osprey
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.turquoise_dreamy_owl.sh
        container: qc.sty_pumpkin_confident_kingfisher
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.raspberry_plucky_parrot.sh
        container: qc.sty_gray_lucky_chameleon
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.fern_motivated_anaconda.sh
        container: qc.sty_onyx_mature_tapir
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.tide_playful_snail.sh
        container: qc.uni_fandango_sincere_groundhog
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.azure_peaceful_angelfish.sh
        container: qc.ver_dusk_meticulous_caiman
timeout: 5400
