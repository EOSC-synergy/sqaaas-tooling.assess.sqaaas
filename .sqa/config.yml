config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_resourceful_groundhog.sh
        container: qc.acc_mulberry_zealous_warthog
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_diligent_salamander.sh
        container: qc.doc_poppy_kind_crocodile
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.pumpkin_logical_armadillo.sh
        container: qc.doc_cobalt_ardent_caiman
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.clementine_intuitive_jaguar.sh
        container: qc.doc_marina_attentive_panda
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.claret_innocent_griffin.sh
        container: qc.lic_pansy_independent_panther
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.verdant_rustic_camel.sh
        container: qc.sec_snow_stoic_salamander
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.pansy_diplomatic_warthog.sh
        container: qc.sty_wine_stoic_stingray
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.wave_independent_caribou.sh
        container: qc.sty_gamboge_responsible_warthog
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.pumpkin_fair_baboon.sh
        container: qc.sty_banana_exuberant_platypus
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.cerulean_productive_cormorant.sh
        container: qc.uni_bluebell_thoughtful_okapi
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.rose_easygoing_pangolin.sh
        container: qc.ver_ruby_mischievous_mandrill
timeout: 5400
