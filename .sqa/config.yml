config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.zinnia_independent_parrot.sh
        container: qc.acc_mint_energetic_puffin
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.gold_graceful_roadrunner.sh
        container: qc.doc_porcelain_protective_phoenix
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.cream_blissful_anaconda.sh
        container: qc.doc_bone_dizzy_hare
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.caramel_zany_crow.sh
        container: qc.doc_snow_articulate_moth
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.zinnia_logical_dingo.sh
        container: qc.lic_peony_calm_spren
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.verdant_devoted_orangutan.sh
        container: qc.sec_silver_perky_macaw
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lapis_amiable_dragonfly.sh
        container: qc.sty_violet_reliable_falcon
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.fandango_happy_elk.sh
        container: qc.sty_snow_analytical_gecko
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.silver_warm_butterfly.sh
        container: qc.sty_persimmon_forgiving_parrot
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.sienna_whimsical_coyote.sh
        container: qc.uni_heather_anxious_vulture
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.kiwi_inventive_giraffe.sh
        container: qc.ver_ginger_scrappy_kangaroo
timeout: 5400
