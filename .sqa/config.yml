config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.flax_spirited_barracuda.sh
        container: qc.acc_gunmetal_delighted_lemur
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.paprika_restless_platypus.sh
        container: qc.doc_tide_studious_ferret
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.cornflower_graceful_vulture.sh
        container: qc.doc_forest_apprehensive_seahorse
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.navy_perky_lynx.sh
        container: qc.doc_clementine_witty_badger
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.blush_anxious_crow.sh
        container: qc.lic_purple_mindful_ibis
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_witty_ibis.sh
        container: qc.sec_glaucous_passionate_giraffe
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lemon_proactive_dingo.sh
        container: qc.sty_echelon_methodical_hamster
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.mauve_affectionate_panda.sh
        container: qc.sty_porcelain_resourceful_lemur
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.blush_imaginative_platypus.sh
        container: qc.sty_thunder_lucky_echidna
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.tide_skeptical_wolverine.sh
        container: qc.uni_gold_frugal_grizzly
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_peppy_seahorse.sh
        container: qc.ver_mustard_helpful_squirrel
timeout: 5400
