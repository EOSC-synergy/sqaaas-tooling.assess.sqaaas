config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.mint_shrewd_donkey.sh
        container: qc.acc_verdant_vigilant_osprey
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pumpkin_cautious_chameleon.sh
        container: qc.doc_pumpkin_vibrant_horse
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.tide_bewildered_chimpanzee.sh
        container: qc.doc_onyx_reflective_hyena
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.arctic_shrewd_badger.sh
        container: qc.doc_lilac_vigilant_seahorse
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.ceru_foolish_alpaca.sh
        container: qc.lic_gray_stubborn_crow
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.ochre_grumpy_stingray.sh
        container: qc.sec_purple_passionate_angelfish
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.bluebell_inspired_goat.sh
        container: qc.sty_rust_unique_albatross
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.magenta_wise_phoenix.sh
        container: qc.sty_cloud_funny_narwhal
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.clove_humorous_newt.sh
        container: qc.sty_vermilion_pensive_grizzly
  QC.Uni:
