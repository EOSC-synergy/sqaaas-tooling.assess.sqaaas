      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.aquamarine_polite_hedgehog.sh
        container: qc.sec_turmeric_anxious_seahorse
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.slate_productive_quokka.sh
        container: qc.sty_steel_delighted_chameleon
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.glaucous_nervous_pegasus.sh
        container: qc.sty_navy_graceful_jaguar
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.nutmeg_easygoing_skunk.sh
