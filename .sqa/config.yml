config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_peppy_donkey.sh
        container: qc.acc_fog_happy_chimpanzee
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lagoon_dedicated_chimpanzee.sh
        container: qc.doc_lilac_trustworthy_emu
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.wine_compassionate_jaguar.sh
        container: qc.doc_persimmon_eccentric_penguin
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_observant_condor.sh
        container: qc.doc_butterscotch_harmonious_snail
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.rose_empathetic_goat.sh
        container: qc.lic_mahogany_decisive_heron
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.olive_empathetic_bullfrog.sh
        container: qc.sec_apricot_sad_lynx
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.pearl_carefree_mandrill.sh
        container: qc.sty_wave_unique_hare
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.prussian_spontaneous_mandrill.sh
        container: qc.sty_banana_thoughtful_puffin
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_intuitive_jaguar.sh
        container: qc.sty_linen_decisive_parrot
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.beige_sweet_marmoset.sh
        container: qc.uni_scarlet_decisive_newt
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.ebony_sad_jellyfish.sh
        container: qc.ver_dahlia_driven_elephant
timeout: 5400
