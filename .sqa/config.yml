config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.coral_zealous_walrus.sh
        container: qc.acc_wisteria_playful_kirin
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_cheerful_dugong.sh
        container: qc.doc_zinnia_driven_camel
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.ecru_honest_osprey.sh
        container: qc.doc_magenta_tough_cockatoo
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.wave_smart_chipmunk.sh
        container: qc.doc_brown_radiant_rhinoceros
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.mint_ardent_shark.sh
        container: qc.lic_linen_warm_raccoon
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cadet_thankful_meerkat.sh
        container: qc.sec_ultramarine_protective_gerbil
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_respectful_antelope.sh
        container: qc.sty_mist_honest_buffalo
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.tundra_proud_hummingbird.sh
        container: qc.sty_mint_insightful_condor
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.mist_attentive_grasshopper.sh
        container: qc.sty_boysenberry_humble_crane
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_blissful_angelfish.sh
        container: qc.uni_bluebell_confused_mongoose
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.viridian_pensive_kirin.sh
        container: qc.ver_sand_understanding_gorilla
timeout: 5400
