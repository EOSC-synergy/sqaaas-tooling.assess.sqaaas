config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.ultramarine_confident_spren.sh
        container: qc.acc_pearl_brave_lionfish
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.malachite_authentic_dolphin.sh
        container: qc.doc_champagne_resourceful_kookaburra
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.mulberry_melancholy_clownfish.sh
        container: qc.doc_mahogany_driven_spren
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_mindful_raccoon.sh
        container: qc.doc_glacier_amused_barracuda
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.gray_kind_pelican.sh
        container: qc.lic_cadet_savvy_ferret
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.linen_relaxed_rabbit.sh
        container: qc.sec_zinnia_smart_roc
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_industrious_seahorse.sh
        container: qc.sty_claret_upbeat_shark
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_driven_antelope.sh
        container: qc.sty_dusk_easygoing_wildcat
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.emerald_cheerful_alpaca.sh
        container: qc.sty_steel_humble_hare
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.verdant_perceptive_sparrow.sh
        container: qc.uni_mango_energetic_porpoise
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.silver_thoughtful_shark.sh
        container: qc.ver_rosewater_organized_meerkat
timeout: 5400
