config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.apricot_daring_thrush.sh
        container: qc.acc_mango_logical_reindeer
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_motivated_hippopotamus.sh
        container: qc.doc_flax_affectionate_impala
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_resilient_alpaca.sh
        container: qc.doc_rust_silly_raccoon
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.mulberry_driven_hydra.sh
        container: qc.doc_mustard_eccentric_impala
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.turquoise_friendly_sphinx.sh
        container: qc.lic_fuchsia_balanced_unicorn
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.marigold_optimistic_lynx.sh
        container: qc.sec_daffodil_radiant_okapi
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.celadon_methodical_seal.sh
        container: qc.sty_papaya_generous_caiman
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.sunset_open_camel.sh
        container: qc.sty_umber_diplomatic_kiwi
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.royal_trustworthy_bison.sh
        container: qc.sty_gamboge_reflective_python
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.jasmine_content_turkey.sh
        container: qc.uni_navy_goofy_kraken
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.nutmeg_humble_griffin.sh
        container: qc.ver_sapphire_humorous_horse
timeout: 5400
