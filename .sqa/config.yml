config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.horizon_organized_tarantula.sh
        container: qc.acc_wisteria_gentle_rhinoceros
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_dreamy_starfish.sh
        container: qc.doc_fog_anxious_flamingo
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.blush_nervous_roadrunner.sh
        container: qc.doc_chestnut_trustworthy_nymph
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.thunder_vigilant_albatross.sh
        container: qc.doc_denim_rugged_nighthawk
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.bone_sad_boa.sh
        container: qc.lic_cinnabar_zealous_donkey
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_fierce_serval.sh
        container: qc.sec_turquoise_brilliant_cassowary
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.eggplant_vibrant_donkey.sh
        container: qc.sty_gold_anxious_ocelot
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.lapis_elated_cormorant.sh
        container: qc.sty_porcelain_jubilant_chinchilla
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.apricot_productive_dormouse.sh
        container: qc.sty_byzantium_easygoing_macaw
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.taupe_grumpy_gull.sh
        container: qc.uni_tundra_driven_otter
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_blissful_clownfish.sh
        container: qc.ver_copper_restless_grasshopper
timeout: 5400
