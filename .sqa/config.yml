      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.jasmine_amused_echidna.sh
        container: qc.sty_gold_ardent_crow
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.bluebell_happy_opossum.sh
        container: qc.sty_bluebell_worried_koala
