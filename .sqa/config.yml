config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.violet_polite_hamster.sh
        container: qc.acc_mahogany_diplomatic_caiman
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_philosophical_chinchilla.sh
        container: qc.doc_cyan_goofy_weasel
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.emerald_funny_chameleon.sh
        container: qc.doc_rose_reliable_toucan
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_apathetic_jaguar.sh
        container: qc.doc_chocolate_daring_osprey
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_funny_wildcat.sh
        container: qc.lic_brown_reflective_hydra
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.turquoise_spirited_newt.sh
        container: qc.sec_walnut_diplomatic_dugong
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cherry_sociable_buffalo.sh
        container: qc.sty_thistle_savvy_catfish
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.ebony_zealous_lemur.sh
        container: qc.sty_wisteria_delighted_roc
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.celadon_assured_alpaca.sh
        container: qc.sty_walnut_blissful_osprey
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.khaki_compassionate_chipmunk.sh
        container: qc.uni_paprika_innocent_moth
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.pine_witty_goose.sh
        container: qc.ver_walnut_bewildered_peacock
timeout: 5400
