config:
  credentials:
  - id: https://github.com/EOSC-synergy/sqaaas-tooling
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/EOSC-synergy/sqaaas-tooling
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.jade_daring_raccoon.sh
        container: qc.acc_orchid_rational_jackal
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.red_peppy_groundhog.sh
        container: qc.doc_iris_creative_caiman
      github.com/EOSC-synergy/sqaaas-tooling git:
        commands:
        - /usr/bin/env sh .sqa/script.reef_reserved_impala.sh
        container: qc.doc_cinnabar_creative_macaw
      github.com/EOSC-synergy/sqaaas-tooling markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.eggplant_sociable_turkey.sh
        container: qc.doc_mint_gracious_dragonfly
  QC.Lic:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling licensee:
        commands:
        - /usr/bin/env sh .sqa/script.thistle_carefree_crocodile.sh
        container: qc.lic_mint_artistic_komodo
  QC.Sec:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling bandit:
        commands:
        - /usr/bin/env sh .sqa/script.incarnadine_easygoing_penguin.sh
        container: qc.sec_heather_gracious_serval
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling flake8:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_bold_gull.sh
        container: qc.sty_aquamarine_elated_donkey
      github.com/EOSC-synergy/sqaaas-tooling hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.byzantium_reserved_clownfish.sh
        container: qc.sty_pansy_bold_whale
      github.com/EOSC-synergy/sqaaas-tooling jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.pistachio_mischievous_macaw.sh
        container: qc.sty_salmon_playful_beaver
  QC.Uni:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling pytest:
        commands:
        - /usr/bin/env sh .sqa/script.espresso_nurturing_sparrow.sh
        container: qc.uni_raspberry_audacious_owl
  QC.Ver:
    repos:
      github.com/EOSC-synergy/sqaaas-tooling get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_thoughtful_stingray.sh
        container: qc.ver_periwinkle_authentic_kiwi
timeout: 5400
